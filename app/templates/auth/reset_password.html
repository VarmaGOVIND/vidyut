<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - VIDYUT</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="d-flex justify-content-center mb-3">
        <div class="logo-bars" style="width:44px; height:40px; border-radius:10px; background:linear-gradient(135deg,#3b82f6,#1d4ed8); display:flex; align-items:center; justify-content:center;">
          <i class="fa-solid fa-layer-group text-white" style="font-size:20px;"></i>
        </div>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your new password below</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <div class="mb-3">
          <label class="form-label-custom">New Password</label>
          <div class="password-wrapper">
            <input type="password" name="password" class="form-control-custom" id="reset-pass" placeholder="Enter new password" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('reset-pass', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" name="confirm_password" class="form-control-custom" id="confirm-pass" placeholder="Confirm new password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirm-pass', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth-primary">Update Password</button>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
