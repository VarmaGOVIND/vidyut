<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Shop - VIDYUT</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="d-flex justify-content-center mb-3">
        <div class="logo-bars" style="width:44px; height:40px; border-radius:10px; background:linear-gradient(135deg,#3b82f6,#1d4ed8); display:flex; align-items:center; justify-content:center;">
          <i class="fa-solid fa-layer-group text-white" style="font-size:20px;"></i>
        </div>
      </div>
      <h1 class="auth-title">Create Your Shop</h1>
      <p class="auth-subtitle">Set up your shop to start billing</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('shop.create_shop') }}">
        <div class="mb-3">
          <label class="form-label-custom">Shop Name</label>
          <input type="text" name="shop_name" class="form-control-custom" placeholder="Enter your shop name" required>
        </div>

        <div class="mb-3">
          <label class="form-label-custom">Phone Number</label>
          <input type="text" name="phone" class="form-control-custom" placeholder="9876543210">
        </div>

        <div class="mb-3">
          <label class="form-label-custom">Shop Address</label>
          <input type="text" name="address" class="form-control-custom" placeholder="123, Main Road, City">
        </div>

        <div class="mb-3">
          <label class="form-label-custom">GST Number</label>
          <input type="text" name="gst_number" class="form-control-custom" placeholder="22AAAAA0000A1Z5">
        </div>

        <button type="submit" class="btn-auth-primary">Create Shop</button>
      </form>

      <div class="auth-footer">
        <a href="{{ url_for('auth.logout') }}">Logout</a>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
