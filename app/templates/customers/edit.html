{% extends "base.html" %}
{% block title %}Edit Customer - VIDYUT{% endblock %}
{% block page_title %}Edit Customer{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-panel">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Customer Name</label>
                    <input type="text" name="name" class="form-control-custom" value="{{ customer.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Phone Number</label>
                    <input type="text" name="phone" class="form-control-custom" value="{{ customer.phone }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control-custom" value="{{ customer.email or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Address</label>
                    <textarea name="address" class="form-control-custom" rows="2">{{ customer.address or '' }}</textarea>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn-quick-primary flex-grow-1">Update Customer</button>
                    <a href="{{ url_for('customers.customer_list') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
